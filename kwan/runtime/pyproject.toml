[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kwantau-dos"
version = "0.13.0a1"
description = "KwanTau Dual Operational System — No run. No implant. Ride."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "KwanTau DOS project"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "cryptography>=43,<47",
  "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[project.scripts]
kwantau = "kwantau_dos.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
