name: Constitutional Execution Gate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/constitutional-execution-gate.yml"
      - "extensions/constitutional-execution/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"
          use-actions-cache: "true"

      - name: Generate canonical lockfile candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile \
            --filter '@openclaw/constitutional-execution...'
          mkdir -p constitutional-gate-artifacts
          cp pnpm-lock.yaml constitutional-gate-artifacts/pnpm-lock.generated.yaml
          git diff -- pnpm-lock.yaml > constitutional-gate-artifacts/pnpm-lock.patch || true

      - name: Install extension dependency closure
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts \
            --filter '@openclaw/constitutional-execution...'

      - name: Typecheck extension
        run: pnpm --filter @openclaw/constitutional-execution run typecheck

      - name: Test extension
        run: pnpm --filter @openclaw/constitutional-execution run test

      - name: Validate plugin manifest and safety defaults
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(
            await readFile('extensions/constitutional-execution/openclaw.plugin.json', 'utf8'),
          );
          if (manifest.id !== 'constitutional-execution') {
            throw new Error('unexpected plugin id');
          }
          const properties = manifest.configSchema?.properties ?? {};
          if (properties.enabled?.default !== false) {
            throw new Error('plugin must remain disabled by default');
          }
          if (properties.mode?.default !== 'shadow') {
            throw new Error('plugin must default to shadow mode');
          }
          for (const name of ['activePolicyHash', 'allowedKeys', 'allowedExecutors', 'allowedCapabilities', 'allowedContractHashes']) {
            if (!(name in properties)) throw new Error(`missing constitutional config field: ${name}`);
          }
          NODE

      - name: Upload generated lockfile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: constitutional-execution-lockfile-${{ github.sha }}
          path: constitutional-gate-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce committed lockfile consistency
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml is stale for the constitutional-execution workspace importer"
            git diff -- pnpm-lock.yaml
            exit 1
          fi
