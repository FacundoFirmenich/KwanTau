name: Constitutional Execution Gate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/constitutional-execution-gate.yml"
      - "extensions/constitutional-execution/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "src/plugins/plugin-api.types.ts"
      - "src/plugins/runtime/types.ts"
      - "src/plugin-sdk/plugin-entry.ts"
      - "src/plugin-sdk/sqlite-runtime.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact promotion candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::tested checkout $actual differs from promotion candidate $expected"
            exit 1
          fi
          printf 'tested_head_sha=%s\n' "$actual" > constitutional-tested-head.txt

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"
          use-actions-cache: "true"

      - name: Verify committed lockfile importer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p constitutional-gate-artifacts
          cp constitutional-tested-head.txt constitutional-gate-artifacts/tested-head.txt
          pnpm install --lockfile-only --frozen-lockfile \
            --filter '@openclaw/constitutional-execution...'
          git diff --exit-code -- pnpm-lock.yaml

      - name: Install canonical workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build canonical strict runtime and Plugin SDK declarations
        id: strict_build
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm build:strict-smoke \
            2>&1 | tee constitutional-gate-artifacts/strict-build.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Produce canonical formatting evidence
        id: format
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt extensions/constitutional-execution
          git diff -- extensions/constitutional-execution \
            > constitutional-gate-artifacts/format.patch
          tar -czf constitutional-gate-artifacts/formatted-extension.tgz \
            extensions/constitutional-execution
          if git diff --quiet -- extensions/constitutional-execution; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check minimal Plugin SDK ABI contract
        id: contract
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm --filter @openclaw/constitutional-execution run contract-check \
            2>&1 | tee constitutional-gate-artifacts/contract-check.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Typecheck extension with captured diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm --filter @openclaw/constitutional-execution run typecheck \
            2>&1 | tee constitutional-gate-artifacts/typecheck.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Test extension with captured diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm --filter @openclaw/constitutional-execution run test \
            2>&1 | tee constitutional-gate-artifacts/tests.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate plugin manifest and safety defaults
        id: manifest
        shell: bash
        run: |
          set +e
          set -o pipefail
          node --input-type=module <<'NODE' \
            2>&1 | tee constitutional-gate-artifacts/manifest.log
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(
            await readFile('extensions/constitutional-execution/openclaw.plugin.json', 'utf8'),
          );
          if (manifest.id !== 'constitutional-execution') {
            throw new Error('unexpected plugin id');
          }
          const properties = manifest.configSchema?.properties ?? {};
          if (properties.enabled?.default !== false) {
            throw new Error('plugin must remain disabled by default');
          }
          if (properties.mode?.default !== 'shadow') {
            throw new Error('plugin must default to shadow mode');
          }
          for (const name of ['activePolicyHash', 'allowedKeys', 'allowedExecutors', 'allowedCapabilities', 'allowedContractHashes', 'liveAuthorityVerifierMethod', 'maxLiveAuthorityAgeMs']) {
            if (!(name in properties)) throw new Error(`missing constitutional config field: ${name}`);
          }
          NODE
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record gate summary
        if: always()
        shell: bash
        run: |
          cat > constitutional-gate-artifacts/summary.txt <<EOF
          strict_build_exit=${{ steps.strict_build.outputs.exit_code }}
          format_exit=${{ steps.format.outputs.exit_code }}
          contract_exit=${{ steps.contract.outputs.exit_code }}
          typecheck_exit=${{ steps.typecheck.outputs.exit_code }}
          tests_exit=${{ steps.tests.outputs.exit_code }}
          manifest_exit=${{ steps.manifest.outputs.exit_code }}
          tested_head_sha=${{ github.event.pull_request.head.sha || github.sha }}
          draft=${{ github.event.pull_request.draft || false }}
          EOF

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: constitutional-execution-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: constitutional-gate-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce gate results
        shell: bash
        run: |
          set -euo pipefail
          failure=0
          if [[ "${{ steps.strict_build.outputs.exit_code }}" != "0" ]]; then
            echo "::error::canonical strict runtime/SDK build failed"
            failure=1
          fi
          if [[ "${{ steps.format.outputs.exit_code }}" != "0" ]]; then
            echo "::error::constitutional extension requires canonical formatting"
            failure=1
          fi
          if [[ "${{ steps.contract.outputs.exit_code }}" != "0" ]]; then
            echo "::error::Plugin SDK constitutional contract drift detected"
            failure=1
          fi
          if [[ "${{ steps.typecheck.outputs.exit_code }}" != "0" ]]; then
            echo "::error::constitutional extension typecheck failed"
            failure=1
          fi
          if [[ "${{ steps.tests.outputs.exit_code }}" != "0" ]]; then
            echo "::error::constitutional extension tests failed"
            failure=1
          fi
          if [[ "${{ steps.manifest.outputs.exit_code }}" != "0" ]]; then
            echo "::error::constitutional plugin manifest validation failed"
            failure=1
          fi
          exit "$failure"
