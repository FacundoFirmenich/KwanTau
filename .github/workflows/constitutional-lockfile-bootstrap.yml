name: Constitutional Lockfile Bootstrap

# One-shot branch workflow. Remove after the canonical importer is committed.
on:
  push:
    branches:
      - codex/constitutional-execution-shadow-v1
    paths:
      - ".github/workflows/constitutional-lockfile-bootstrap.yml"
      - "extensions/constitutional-execution/package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

concurrency:
  group: constitutional-lockfile-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.repository == 'FacundoFirmenich/KwanTau' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true
          ref: codex/constitutional-execution-shadow-v1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"
          use-actions-cache: "true"

      - name: Materialize minimal constitutional importer
        shell: bash
        run: |
          set -euo pipefail
          cp pnpm-lock.yaml /tmp/pnpm-lock.base.yaml
          pnpm install --lockfile-only --no-frozen-lockfile \
            --filter '@openclaw/constitutional-execution...'
          python - <<'PY'
          from pathlib import Path
          candidate = Path('pnpm-lock.yaml').read_text()
          base = Path('/tmp/pnpm-lock.base.yaml').read_text()
          marker = '  extensions/constitutional-execution:\n'
          if marker in base:
              Path('pnpm-lock.yaml').write_text(base)
              raise SystemExit(0)
          start = candidate.index(marker)
          end = candidate.index('\n  extensions/', start + len(marker)) + 1
          block = candidate[start:end]
          insertion = base.index('  extensions/copilot:\n')
          Path('pnpm-lock.yaml').write_text(base[:insertion] + block + base[insertion:])
          PY
          pnpm install --lockfile-only --frozen-lockfile \
            --filter '@openclaw/constitutional-execution...'

      - name: Commit canonical lockfile importer
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile importer already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): lock constitutional execution workspace"
          git push origin HEAD:codex/constitutional-execution-shadow-v1
