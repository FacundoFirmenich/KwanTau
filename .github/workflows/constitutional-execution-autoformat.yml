name: Constitutional Execution Autoformat

on:
  push:
    branches:
      - codex/constitutional-execution-shadow-v1
    paths:
      - ".github/workflows/constitutional-execution-autoformat.yml"
      - "extensions/constitutional-execution/**"

permissions:
  contents: write

concurrency:
  group: constitutional-execution-autoformat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: codex/constitutional-execution-shadow-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"
          use-actions-cache: "true"

      - name: Install canonical workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format constitutional extension
        run: pnpm exec oxfmt extensions/constitutional-execution

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- extensions/constitutional-execution; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/constitutional-execution
          git commit -m "style(gateway): apply canonical constitutional formatting"
          git push origin HEAD:codex/constitutional-execution-shadow-v1
