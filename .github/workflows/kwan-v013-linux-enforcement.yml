name: KWAN v0.13 Linux enforcement gate

on:
  push:
    branches: [kwan/integral-v0.13-shadow]
    paths:
      - 'kwan/enforcement/linux/**'
      - '.github/workflows/kwan-v013-linux-enforcement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-enforcement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install enclosure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp-dev jq xz-utils

      - name: Download pinned Wasmtime
        env:
          WASMTIME_VERSION: '49.0.2'
          WASMTIME_ASSET_SHA256: 'a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322'
        run: |
          set -euo pipefail
          url="https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl --fail --location --retry 4 "$url" -o /tmp/wasmtime.tar.xz
          echo "${WASMTIME_ASSET_SHA256}  /tmp/wasmtime.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kwan-wasmtime"
          tar -xJf /tmp/wasmtime.tar.xz -C "$RUNNER_TEMP/kwan-wasmtime" --strip-components=1
          echo "KWAN_WASMTIME_BIN=$RUNNER_TEMP/kwan-wasmtime/wasmtime" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/kwan-wasmtime/wasmtime" --version

      - name: Execute material Linux enforcement gate
        run: |
          set -euo pipefail
          export KWAN_EVIDENCE_DIR="$RUNNER_TEMP/kwan-v013-enforcement"
          bash kwan/enforcement/linux/run_gate.sh

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwan-v013-linux-enforcement
          path: ${{ runner.temp }}/kwan-v013-enforcement
          if-no-files-found: warn
